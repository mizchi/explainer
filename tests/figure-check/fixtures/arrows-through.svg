<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" font-family="sans-serif" font-size="18">
  <!-- A から C への線が、途中の B の箱を突き抜ける（data-edge / data-node を付けた手書きの SVG） -->
  <rect data-node="A" x="10" y="70" width="90" height="60" fill="#fff" stroke="#333"/>
  <text x="55" y="106" text-anchor="middle">A</text>
  <rect data-node="B" x="215" y="70" width="90" height="60" fill="#fff" stroke="#333"/>
  <text x="260" y="92" text-anchor="middle">B</text>
  <rect data-node="C" x="420" y="70" width="90" height="60" fill="#fff" stroke="#333"/>
  <text x="465" y="106" text-anchor="middle">C</text>
  <path data-edge="A->C" d="M100 115 L420 115" fill="none" stroke="#333" stroke-width="2"/>
</svg>
