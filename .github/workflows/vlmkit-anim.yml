name: vlmkit-anim

# The `@mizchi/vlmkit-anim` package: build, typecheck and test on every change to it,
# and publish to npm on a `vlmkit-anim-v*` tag through npm Trusted Publishing (OIDC) —
# no token exists anywhere. The package's trusted publisher on npmjs.com names this
# repository and this file.
#
#   git tag vlmkit-anim-v0.24.0 && git push origin vlmkit-anim-v0.24.0
#
# The tag must equal `vlmkit-anim-v` + packages/vlmkit-anim/package.json's version;
# the publish step refuses otherwise. A version already on npm is skipped, so a
# failed run is re-run as is.

on:
  pull_request:
    paths:
      - "packages/vlmkit-anim/**"
      - ".github/workflows/vlmkit-anim.yml"
  push:
    branches: [main]
    paths:
      - "packages/vlmkit-anim/**"
      - ".github/workflows/vlmkit-anim.yml"
    tags: ["vlmkit-anim-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: packages/vlmkit-anim

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/vlmkit-anim/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/vlmkit-anim-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "vlmkit-anim-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1
          fi
          if npm view "@mizchi/vlmkit-anim@${version}" version >/dev/null 2>&1; then
            echo "@mizchi/vlmkit-anim@${version} is already on npm; nothing to do"; exit 0
          fi
          npm publish --access public
